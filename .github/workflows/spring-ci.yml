name: Build and Test Spring Boot Microservice

on:
  push:
    branches:
      - CI

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      oracle-db:
        image: gvenzl/oracle-xe
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: Oracle123
          ORACLE_DATABASE: XEPDB1
        options: --health-cmd="echo 'SELECT 1 FROM DUAL;' | sqlplus system/Oracle123@localhost:1521/XEPDB1" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip
        pip3 install oracledb pandas

    - name: Wait for Oracle DB
      run: sleep 60

    - name: Create Schema
      run: |
        echo "Creating Table"
        cat data/DB_CreateTable.sql | sqlplus system/Oracle123@localhost:1521/XEPDB1


    - name: Load Test Data
      run: python3 data/load_trades.py

    - name: Build App
      run: ./mvnw clean install
