name: Spring Boot CI with Oracle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      oracle-db:
        image: gvenzl/oracle-xe
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: Oracle123
        options: >-
          --health-cmd="echo 'SELECT 1 FROM DUAL;' | sqlplus system/Oracle123@localhost/XEPDB1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name:  Checkout source code
      uses: actions/checkout@v3

    - name:  Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip
        pip3 install oracledb pandas

    - name:  Wait for Oracle DB to fully start
      run: sleep 90
    - name: Create Schema
      run: |
        echo "Creating Table"
        docker exec oracle-db bash -c "echo \"$(< data/DB_CreateTable.sql)\" | sqlplus system/Oracle123@localhost/XEPDB1"

    - name:  Load test data (run your load_trades.py)
      run: |
        python3 data/load_trades.py

    - name:  Build and Test
      run: ./mvnw clean install
